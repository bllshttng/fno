[pytest]
markers =
    slow_e2e: slow end-to-end tests; excluded from per-PR CI via '-m not slow_e2e'
    e2e: end-to-end tests requiring slower setup; run explicitly with -m e2e
    smoke: real-binary smoke tests; excluded from CI
    serial: known parallel racer; grouped onto one xdist worker and still executed
    dev_build: needs this checkout's fno-agents build
# A hung test must name itself and cost little.
timeout = 120
