# The ambient-state vocabulary: one inventory of the env names a test child
# must not read from the developer's shell. Canonical here; the Python package
# reads a byte copy at cli/src/fno/ambient_vocab.toml (generated by build.rs,
# freshness-gated by generated-artifacts.tsv). Ported from cli/src/fno/hermetic.py
# on 2026-10-26 (Plan A); the classification logic lives in test_env.rs
# and the state-root fence stays Python (hermetic.declared_root).
#
# docs/architecture/test-hermeticity.md holds the rule this table serves.

# Every FNO_* and TARGET_* name is ambient until proven otherwise. A new
# FNO_ var added to source neutralises without editing this file.
prefixes = ["FNO_", "TARGET_"]

