# Toolchain caches resolved at their REAL values before HOME swaps, so a
# sandboxed HOME does not turn a four-minute suite into a full rebuild.
cache_names = [
    "CARGO_HOME",
    "RUSTUP_HOME",
    "UV_CACHE_DIR",
    "PIP_CACHE_DIR",
    "XDG_CACHE_HOME",
    "npm_config_cache",
    "SCCACHE_DIR",
]

# Cache defaults under the real home; an unset var still has to be pinned.
[cache_defaults]
CARGO_HOME = ".cargo"
RUSTUP_HOME = ".rustup"
XDG_CACHE_HOME = ".cache"

# XDG config/data/state are sandboxed (they are state); XDG_CACHE_HOME is a
# cache and rides cache_names instead.
xdg_sandboxed = ["XDG_CONFIG_HOME", "XDG_DATA_HOME", "XDG_STATE_HOME"]

# The deliberately UNCOVERED name: carries no FNO_ prefix, not a session
# marker, so nothing scrubs it. It simulates the channel this inventory has
# not thought of yet, and the dirty lane's canary test is its positive control.
ambient_leak_canary = "AMBIENT_LEAK_CANARY"
