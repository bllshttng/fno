# The bridge wheel's build root: a TOML-only
# hatchling project. The wheel carries the four Rust binaries as shared
# scripts, so `uv tool install fno` lands a working `fno` front door. This
# root survives the Python-runtime deletion (the old root read cli/ as its
# package).
#
# THE ONE DELETION POINT: until the Python runtime is deleted, the wheel
# still carries the Python package (force-include below + the fno-py
# console script). That keeps the binary install's self-provision working
# (`fno do ...` installs the PyPI wheel to reach fno-py) and the release
# smokes green. The deletion PR removes the force-include block, the fno-py
# script line, and the Python source, and this root becomes packageless in
# that same change.
#
# Measured on uv 0.13.5: uv records every shared script in
# [[tool.entrypoints]], so the first-run move's relink finds `fno` there, and
# an unpinned by-name receipt stays index-style, so receipt_is_index reads it
# as a wheel install.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fno"
# Stamped by scripts/release/sync-version.sh from the release version (PEP 440),
# never from the Python package's __init__.py, which the deletion removes.
dynamic = ["version"]
requires-python = ">=3.11"

[project.scripts]
# The Python CLI console script, as today. The deletion PR removes it with the package.
fno-py = "fno.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
# bypass-selection: no auto-discovered packages; the payload is exactly the
# force-include map plus the shared scripts.
bypass-selection = true
# The Python package rides as content until the runtime deletion (see the header). Sources
# resolve relative to this root, one level above cli/.
force-include = { "../../cli/src/fno" = "fno", "../../LICENSE" = "fno/_licenses/LICENSE", "../../NOTICE" = "fno/_licenses/NOTICE" }

[tool.hatch.build.targets.wheel.shared-scripts]
"staged/fno" = "fno"
"staged/fno-agents" = "fno-agents"
"staged/fno-agents-daemon" = "fno-agents-daemon"
"staged/fno-agents-worker" = "fno-agents-worker"
