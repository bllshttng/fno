# The bridge wheel's build root (x-be9f, law d-df1f42c1): a TOML-only
# hatchling project. The wheel carries the four Rust binaries as shared
# scripts, so `uv tool install fno` lands a working `fno` front door. This
# root survives x-8b53 deleting cli/ (the old root read cli/ as its package).
#
# THE ONE DELETION POINT: until x-8b53 lands, the wheel still carries the
# Python package (force-include below + the fno-py console script). That
# keeps the binary install's self-provision working (`fno do ...` installs
# the PyPI wheel to reach fno-py) and the release smokes green. x-8b53
# deletes the force-include block, the fno-py script line, and cli/src/fno,
# and this root becomes packageless in the same PR that deletes Python.
#
# Measured on uv 0.13.5: uv records every shared script in
# [[tool.entrypoints]], so the first-run move's relink finds `fno` there, and
# an unpinned by-name receipt stays index-style, so receipt_is_index reads it
# as a wheel install.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fno"
# Stamped by scripts/release/sync-version.sh from the release version (PEP 440),
# never from cli/src/fno/__init__.py: x-8b53 deletes that file.
dynamic = ["version"]
requires-python = ">=3.11"

[project.scripts]
# The Python CLI console script, as today. Deleted by x-8b53 with the package.
fno-py = "fno.cli:main"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
# bypass-selection: no auto-discovered packages; the payload is exactly the
# force-include map plus the shared scripts.
bypass-selection = true
# The Python package rides as content until x-8b53 (see the header). Sources
# resolve relative to this root, one level above cli/.
force-include = { "../../cli/src/fno" = "fno", "../../LICENSE" = "fno/_licenses/LICENSE", "../../NOTICE" = "fno/_licenses/NOTICE" }

[tool.hatch.build.targets.wheel.shared-scripts]
"staged/fno" = "fno"
"staged/fno-agents" = "fno-agents"
"staged/fno-agents-daemon" = "fno-agents-daemon"
"staged/fno-agents-worker" = "fno-agents-worker"
