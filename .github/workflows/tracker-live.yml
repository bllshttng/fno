name: tracker-live

on:
  workflow_dispatch:

concurrency:
  group: tracker-live
  cancel-in-progress: false

jobs:
  journey:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check live gate secrets
        id: live
        env:
          FNO_LIVE_GITHUB_TOKEN: ${{ secrets.FNO_LIVE_GITHUB_TOKEN }}
        run: |
          if [[ -z "${FNO_LIVE_GITHUB_TOKEN:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FNO_LIVE_GITHUB_TOKEN is not configured; tracker live gate skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.live.outputs.configured == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        if: steps.live.outputs.configured == 'true'
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install fno from this checkout
        if: steps.live.outputs.configured == 'true'
        run: |
          cargo build --quiet --manifest-path crates/fno-agents/Cargo.toml --bin fno-agents
          uv tool install --editable ./cli
          echo "$PWD/crates/fno-agents/target/debug" >> "$GITHUB_PATH"

      - name: Run the live journeys
        if: steps.live.outputs.configured == 'true'
        env:
          FNO_STATE_DIR: ${{ runner.temp }}/fno-state
          FNO_LIVE_GITHUB_REPO: ${{ vars.FNO_LIVE_GITHUB_REPO }}
          FNO_LIVE_GITHUB_TOKEN: ${{ secrets.FNO_LIVE_GITHUB_TOKEN }}
          FNO_LIVE_LINEAR_API_KEY: ${{ secrets.FNO_LIVE_LINEAR_API_KEY }}
          FNO_LIVE_LINEAR_TEAM: ${{ vars.FNO_LIVE_LINEAR_TEAM }}
        run: cargo test -p fno-agents --test tracker_live -- --ignored --nocapture --test-threads=1

      - name: Upload receipts
        if: always() && steps.live.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tracker-live-receipts
          path: ${{ runner.temp }}/fno-state/live-gates/
          if-no-files-found: ignore
