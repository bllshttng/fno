name: main-binaries

# Build the platform tarballs on each main merge that touches crates/, so
# `fno update` downloads the binaries instead of compiling them. A local
# compile of fno-agents ran 2 hours at load 297; the download is seconds.
#
# The assets land on the rolling `bin-cache` pre-release, keyed by the crates/
# subtree rev (the rev the binaries bake in and the update verdict compares):
# fno-bin-<rev>-<platform>.tar.gz plus a .sha256 file. The reader is
# crates/fno/src/update_prebuilt.rs. bin-cache is no release: no version, no
# registry, no approval, the same posture as the nightly tag.
#
# The rebuild skip keys on the pair (crates rev, packaging rev). The two
# workflow files in `paths:` are the packaging, so a workflow-only edit must
# republish under the same crates rev: the tarballs bake in no trace of the
# pack that built them, and reusing the old assets would ship stale packaging
# forever. The pack marker is the fno-bin-<rev>-pack-<pack rev>.txt asset.

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - .github/workflows/main-binaries.yml
      - .github/workflows/release-binaries.yml
  workflow_dispatch:

# Only the newest main head builds. A burst of crates merges cancels the
# older builds in flight; the update and the post-merge sync read the
# newest published rev, so a cancelled middle build never stalls them.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: resolve the build key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      crates_rev: ${{ steps.rev.outputs.crates_rev }}
      pack_rev: ${{ steps.rev.outputs.pack_rev }}
      skip: ${{ steps.rev.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the build key and skip a key already published
        id: rev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rev="$(git log -1 --format=%H -- crates/)"
          echo "crates_rev=$rev" >> "$GITHUB_OUTPUT"
          pack="$(git log -1 --format=%H -- .github/workflows/main-binaries.yml .github/workflows/release-binaries.yml)"
          echo "pack_rev=$pack" >> "$GITHUB_OUTPUT"
          # A rerun of an unchanged key finds the four tarballs and their
          # pack marker there. A workflow-only edit misses the marker and
          # republishes.
          names="$(gh release view bin-cache --json assets --jq '.assets[].name' 2>/dev/null || true)"
          have="$(printf '%s\n' "$names" | grep -c "^fno-bin-${rev}-.*\.tar\.gz$" || true)"
          marked="$(printf '%s\n' "$names" | grep -c "^fno-bin-${rev}-pack-${pack}\.txt$" || true)"
          if [ "$have" -ge 4 ] && [ "$marked" -ge 1 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "crates rev $rev at packaging $pack is already on bin-cache"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/release-binaries.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: publish to bin-cache
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Upload under the build key and prune old revs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REV: ${{ needs.resolve.outputs.crates_rev }}
          PACK: ${{ needs.resolve.outputs.pack_rev }}
        run: |
          set -euo pipefail
          cd dist
          for f in fno-agents-*.tar.gz; do
            platform="${f#fno-agents-}"
            platform="${platform%.tar.gz}"
            name="fno-bin-${REV}-${platform}.tar.gz"
            mv "$f" "$name"
            sha256sum "$name" > "$name.sha256"
          done
          # The pack marker records which packaging built these tarballs;
          # the skip check reads it back by name.
          printf '%s\n' "$PACK" > "fno-bin-${REV}-pack-${PACK}.txt"
          if ! gh release view bin-cache -R "$REPO" >/dev/null 2>&1; then
            # Two merges can race here; the loser's create fails and its
            # upload still lands on the winner's release.
            gh release create bin-cache -R "$REPO" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "bin-cache" \
              --notes "Rolling cache of main-branch binaries for fno update, keyed by crates/ rev. Not a release." || true
          fi
          gh release upload bin-cache -R "$REPO" --clobber fno-bin-*
          # The latest manifest goes up after the tarballs, so a rev it names
          # is always downloadable. `fno update` reads it through the download
          # URL, which the per-IP REST limit does not meter.
          for f in fno-bin-"${REV}"-*.tar.gz; do
            platform="${f#fno-bin-${REV}-}"
            printf '%s %s\n' "$REV" "${platform%.tar.gz}"
          done > fno-bin-latest.txt
          gh release upload bin-cache -R "$REPO" --clobber fno-bin-latest.txt
          # Keep the newest 15 revs (4 tarballs, 4 digests and 1 pack marker
          # each) plus the latest manifest.
          release_id="$(gh api "repos/$REPO/releases/tags/bin-cache" --jq .id)"
          gh api --paginate "repos/$REPO/releases/$release_id/assets?per_page=100" \
            --jq '.[] | "\(.created_at) \(.id)"' | sort -r | tail -n +137 | while read -r _ id; do
            gh api -X DELETE "repos/$REPO/releases/assets/$id" || true
          done
