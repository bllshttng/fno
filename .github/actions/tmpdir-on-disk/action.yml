name: tmpdir-on-disk
description: >
  Print the /tmp mount, and point TMPDIR at a root-disk directory when /tmp is
  a tmpfs.

# Test sandboxes and scratch dirs come from tempfile.mkdtemp and
# std::env::temp_dir, so they follow TMPDIR. Newer runner images mount /tmp as
# a tmpfs with a per-user quota, and a cold fno lib-test build there died with
# "Disk quota exceeded" (errno 122) while / had 106G free. Mounting over a
# live /tmp would hide files the runner holds open there. /ft is shorter than
# /tmp, so socket paths stay under the AF_UNIX limit.

runs:
  using: composite
  steps:
    - name: Put TMPDIR on the runner disk
      if: runner.os == 'Linux'
      shell: bash
      run: |
        findmnt -T /tmp -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL,OPTIONS
        if [[ "$(findmnt -n -o FSTYPE -T /tmp)" == tmpfs ]]; then
          sudo install -d -m 1777 /ft
          echo "TMPDIR=/ft" >> "$GITHUB_ENV"
          findmnt -T /ft -o TARGET,SOURCE,FSTYPE,SIZE,AVAIL,OPTIONS
        fi
