<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fno command</title>
<style>
/* fno-house */
/* The command page in the house style: monochrome ink on the theme tokens,
   square edges, mono type. Hue carries state only. The table and drawer rules
   below still use the older names, which alias the tokens. */
:root{--writing:var(--green);--parked:var(--yellow);--quiet:var(--violet);--unknown:var(--overlay1);--ok:var(--green);--link:var(--blue);--font-ui:var(--mono);--font-data:var(--mono)}
.bar{position:sticky;top:var(--fno-nav-h,0px);z-index:5}
.bar #age{color:var(--overlay1);font-size:11.5px;margin-right:auto}
.wrap{padding:12px max(14px,env(safe-area-inset-right,0px)) 32px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.counts,.seg{display:flex;flex-wrap:wrap;gap:6px}
.controls button.count{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-variant-numeric:tabular-nums}.controls button.count[aria-pressed="false"]{color:var(--overlay1);border-style:dashed}
.dot{width:7px;height:7px;flex:none;display:inline-block}.controls span.count{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;min-height:26px;border:1px solid var(--surface0);font-size:12px;font-variant-numeric:tabular-nums}
#banners:empty{display:none}.banner{padding:4px 10px;border:1px solid var(--yellow);color:var(--yellow)}
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:10px}
.host{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;padding:10px 12px;background:var(--mantle);border:1px solid var(--surface0)}.host canvas{width:120px;height:120px}
.hinfo{display:flex;flex-direction:column;gap:5px;min-width:0}.hname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hname b{font-size:14px;font-weight:700}.hname span{font-size:11px;color:var(--overlay1)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green)}.live i{width:7px;height:7px;background:var(--green)}.live.stale{color:var(--yellow)}.live.stale i{background:var(--yellow)}
.meter{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:11.5px}.meter>span:first-child{color:var(--overlay1)}.meter b{font-weight:500;font-variant-numeric:tabular-nums}.track{height:4px;background:var(--surface0);overflow:hidden}.track i{display:block;height:100%}.mix{display:flex;height:4px;overflow:hidden;gap:1px}
.panel{border:1px solid var(--surface0);background:var(--mantle);padding:10px 12px;display:flex;flex-direction:column;gap:6px}.panel h2,.panel h3{margin:4px 0 2px;font-size:11px;color:var(--overlay1);font-weight:700}.panel h2::before,.panel h3::before{content:"## "}
.lk{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--surface0);background:var(--base)}.lt{display:flex;flex-direction:column;min-width:0;gap:2px;flex:1}.lt b{font-weight:600;overflow-wrap:anywhere}.lt code{font:inherit;font-size:11px;color:var(--yellow);overflow-wrap:anywhere}
.empty{color:var(--overlay1);margin:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.filters label{font-size:12px;color:var(--overlay1);margin-right:2px}
.chip{border:1px solid var(--surface1);background:var(--base);color:var(--subtext0);font-size:12px;padding:3px 10px;cursor:pointer;min-height:26px}.chip:hover{border-color:var(--text)}.chip[aria-pressed="true"]{color:var(--text);border-color:var(--text)}.chip[aria-checked="true"]{background:var(--text);color:var(--base);border-color:var(--text)}
.view{display:flex;flex-direction:column;gap:12px}.view[hidden]{display:none}
.stage{position:relative;height:min(76vh,780px);min-height:420px;overflow:hidden;border:1px solid var(--surface0);background:var(--base)}.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}.stage canvas.dragging{cursor:grabbing}
.layouts{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--mantle);border:1px solid var(--surface0);z-index:2;max-width:calc(100% - 24px);overflow-x:auto}.layouts .lbl{font-size:12px;color:var(--overlay1);padding:0 2px;white-space:nowrap}.layouts .chip{white-space:nowrap}
.lnote{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--overlay1);text-align:center;max-width:calc(100% - 24px);pointer-events:none;z-index:2;margin:0}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;padding:5px 10px;background:var(--mantle);border:1px solid var(--surface0);font-size:11px;color:var(--overlay1);max-width:calc(100% - 20px)}.legend span{display:inline-flex;align-items:center;gap:6px}.shp{width:9px;height:9px;display:inline-block;background:var(--subtext0)}.shp.circle{border-radius:50%}.shp.diamond{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}.shp.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}.shp.hexagon{clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%)}.hint{position:absolute;right:10px;bottom:10px;font-size:11px;color:var(--overlay1);pointer-events:none}
.tip{position:absolute;pointer-events:none;min-width:220px;max-width:300px;padding:7px 10px;background:var(--mantle);border:1px solid var(--surface1);opacity:0;transition:opacity .15s;font-size:12px;line-height:1.4;z-index:3}.tip.on{opacity:1}.tip .t1{font-weight:700;margin-bottom:3px}.tip .t2{font-size:11px;color:var(--overlay1)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){.stage{height:62vh}.hint{display:none}.bar{position:static}}@media (max-width:480px){.host{grid-template-columns:88px minmax(0,1fr)}.host canvas{width:88px;height:88px}}
.tablewrap{border:1px solid var(--surface0);background:var(--mantle)}.ttools{display:flex;flex-wrap:wrap;gap:10px;padding:8px 12px;border-bottom:1px solid var(--surface0);align-items:center}.ttools input{flex:1 1 220px;min-width:0;background:var(--base);border:1px solid var(--surface1);color:var(--text);padding:4px 8px;min-height:26px;font:12px var(--mono)}.ttools input:focus{border-color:var(--text);outline:none}.ttools span{font-size:11.5px;color:var(--overlay1)}
.tscroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1060px}th,td{text-align:left;padding:6px 12px;border-bottom:1px solid var(--surface0);vertical-align:top;font-size:12px}th{font-size:11px;color:var(--overlay1);font-weight:700;cursor:pointer;user-select:none;white-space:nowrap;background:var(--mantle)}th:hover{color:var(--text)}th[aria-sort]{color:var(--text)}th[aria-sort]::after{content:" ↓"}th[aria-sort="ascending"]::after{content:" ↑"}
tbody tr{cursor:pointer}tbody tr:hover,tbody tr:focus-visible{background:var(--base)}td .sub{color:var(--overlay1);font-size:11px;margin-top:2px;display:block;max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.drawer{position:fixed;top:calc(var(--fno-nav-h,0px) + 8px);right:8px;bottom:8px;width:min(440px,calc(100vw - 16px));z-index:20;background:var(--mantle);border:1px solid var(--surface1);transform:translateX(calc(100% + 16px));visibility:hidden;transition:transform .2s ease-out,visibility .2s;display:flex;flex-direction:column;overflow:hidden}.drawer.on{transform:none;visibility:visible}
.dhead{padding:12px 14px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--surface0)}.dtop{display:flex;align-items:center;gap:8px}.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;font-size:11.5px;font-weight:700;border:1px solid var(--surface1)}.x{margin-left:auto;width:26px;height:26px;border:1px solid var(--surface1);background:var(--base);color:var(--subtext0);cursor:pointer;font:inherit;font-size:14px;line-height:1}.x:hover{color:var(--text);border-color:var(--text)}
.dhead h2{margin:0;font-size:14px;line-height:1.35;font-weight:700}.dnode{font-size:11.5px;color:var(--overlay1)}.dbody{padding:10px 14px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}.sec h3{margin:0 0 6px;font-size:11px;color:var(--overlay1);font-weight:700}.sec h3::before{content:"## "}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:12px;margin:0}.kv dt{color:var(--overlay1)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.mono{font-size:11.5px}.links{display:flex;flex-direction:column;gap:6px}a.lk{color:var(--text);text-decoration:none}a.lk:hover{border-color:var(--text)}.lk button{border:1px solid var(--surface1);background:var(--mantle);color:var(--subtext0);font:inherit;font-size:11px;padding:2px 8px;cursor:pointer;min-height:24px}.lk button:hover{color:var(--text);border-color:var(--text)}
@media (max-width:640px){.drawer{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:78vh;transform:translateY(calc(100% + 16px))}.kv{grid-template-columns:96px minmax(0,1fr)}}
</style>
</head>
<body>
<header class="controls bar"><span class="mark">Ｆ<b>[no]</b> command</span><span id="age">fno fleet · reading</span>
  <span class="lbl">state</span><div class="counts" id="counts"></div>
  <span class="lbl">view</span><div class="seg" role="tablist" aria-label="View"><button role="tab" id="tab-synapse" aria-selected="true">synapse</button><button role="tab" id="tab-table" aria-selected="false">table</button></div></header>
<div class="wrap">
  <div id="banners"></div>
  <section class="fleet" id="machines" aria-label="Machines"><p class="empty">reading the fleet</p></section>
  <div class="filters" id="chips"><label>Machine</label></div>
  <div class="view" id="view-synapse">
    <section class="stage" aria-label="Fleet synapse map"><canvas id="cv"></canvas>
      <div class="layouts" role="radiogroup" aria-label="Layout"><span class="lbl">Group by</span><button class="chip" role="radio" aria-checked="true" data-layout="constellation">Projects</button><button class="chip" role="radio" aria-checked="false" data-layout="hemispheres">Machines</button><button class="chip" role="radio" aria-checked="false" data-layout="transit">Subway</button></div>
      <p class="lnote" id="lnote"></p>
      <div class="legend"><span id="lhosts" style="display:contents"></span><span><i class="dot" style="background:var(--writing)"></i>writing</span><span><i class="dot" style="background:var(--parked)"></i>parked</span><span><i class="dot" style="background:var(--quiet)"></i>quiet</span><span><i class="dot" style="border:1.5px solid var(--unknown)"></i>unknown</span><span><i class="dot" style="border:1.5px solid var(--text)"></i>lead</span><span><i class="dot" style="background:var(--subtext0)"></i>project / epic</span></div>
      <div class="hint">Hover to fire · click for details · drag to pan · scroll to zoom</div>
      <div class="tip" id="tip"></div>
    </section>
    <section class="panel" aria-label="Waiting on you"><h2>Waiting on you</h2><div id="waiting"></div></section>
  </div>
  <section class="tablewrap" id="view-table" hidden aria-label="Seats">
    <div class="ttools"><input id="filter" type="search" placeholder="Filter by seat, node, title, model, session id" aria-label="Filter seats"><span id="rowcount"></span></div>
    <div class="tscroll"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
</div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Seat details">
  <div class="dhead"><div class="dtop"><span class="pill" id="dstate"></span><span class="mono" id="dhost" style="color:var(--overlay1)"></span><button class="x" id="dclose" aria-label="Close details">×</button></div><h2 id="dtitle"></h2><div class="dnode" id="dnode"></div></div>
  <div class="dbody" id="dbody"></div>
</aside>
<script>
(() => {
const ORDER = ["writing", "parked", "quiet", "unknown"];
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const ago = (s) => s == null ? "unknown" : s < 90 ? s + "s" : s < 5400 ? Math.round(s / 60) + "m" : s < 172800 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d";
const dot = (state) => { const d = el("i", "dot"); d.style.background = "var(--" + state + ")"; return d; };
const since = (iso) => { const t = Date.parse(iso); return isNaN(t) ? null : Math.max(0, Math.round((Date.now() - t) / 1000)); };

function header(model) {
  const all = model.machines.flatMap((m) => m.leads.flatMap((l) => l.seats));
  const counts = document.getElementById("counts");
  counts.replaceChildren();
  const q = model.waiting.questions;
  const add = (n, word, color) => {
    const c = el(color ? "button" : "span", "count");
    if (color) {
      c.append(dot(color));
      c.setAttribute("aria-pressed", String(!hiddenStates.has(color)));
      c.onclick = () => { hiddenStates.has(color) ? hiddenStates.delete(color) : hiddenStates.add(color); header(model); paint(); cam.tk = fitK(); };
    }
    c.append(el("b", null, n), " " + word);
    counts.append(c);
  };
  for (const s of ORDER) add(all.filter((x) => x.status === s).length, s, s);
  add(q ? q.length : "?", "questions");
  document.getElementById("age").textContent = "fno fleet · " + (model.age_s == null ? "not read" : "read " + ago(model.age_s) + " ago") + " · " + all.length + " sessions";
}

function banners(model) {
  const box = document.getElementById("banners");
  box.replaceChildren();
  const add = (text) => box.append(el("div", "banner", text));
  const e = model.fleet_error;
  if (e && model.machines.length) add("fleet read failed " + ago(e.failed_age_s) + " ago: " + e.reason + "; showing the read from " + ago(model.age_s) + " ago");
  if (model.notice) add(model.notice);
  if (model.seat_error) add(model.seat_error);
}

function waiting(model) {
  const box = document.getElementById("waiting");
  box.replaceChildren();
  const w = model.waiting;
  if (w.questions_error) box.append(el("p", "empty", "questions not read: " + w.questions_error));
  const qs = w.questions || [];
  const hosts = [...new Set(qs.map((q) => q.host))].sort((a, b) => (a != null) - (b != null) || String(a).localeCompare(String(b)));
  for (const host of hosts) {
    box.append(el("h3", null, host == null ? "this machine" : host));
    for (const q of qs.filter((x) => x.host === host)) {
      const r = el("div", "lk"), t = el("span", "lt");
      t.append(el("b", null, q.title || q.id));
      t.append(el("code", null, [q.node || "no node", ago(since(q.created_at)) + " old", "fno inbox outstanding clear " + q.id + " --answer \"…\"" + (host == null ? "" : " (on " + host + ")")].join(" · ")));
      r.append(t);
      box.append(r);
    }
  }
  if (w.prs_error) box.append(el("p", "empty", "PRs not read: " + w.prs_error + "; showing the last read"));
  const prs = w.prs || [];
  if (prs.length) box.append(el("h3", null, "PRs in review"));
  for (const p of prs) {
    const r = el(p.url ? "a" : "div", "lk"), t = el("span", "lt");
    if (p.url && p.url.startsWith("https://")) r.href = p.url;
    t.append(el("b", null, "#" + p.number + " " + (p.title || "")), el("code", null, p.node + " · " + (p.merge_status || "merge state not recorded")));
    r.append(t);
    box.append(r);
  }
  if (!qs.length && !prs.length && !w.questions_error && !w.prs_error) box.append(el("p", "empty", "Nothing waits on you (read " + ago(model.age_s) + " ago)"));
}

const meter = (label, bar, value) => {
  const m = el("div", "meter");
  m.append(el("span", null, label), bar, el("b", null, value));
  return m;
};
const track = (frac, color) => {
  const t = el("span", "track"), i = el("i");
  if (frac != null) { i.style.width = Math.min(100, frac * 100) + "%"; i.style.background = "var(--" + color + ")"; }
  t.append(i);
  return t;
};
let cards = [];
function machines(model) {
  const box = document.getElementById("machines");
  box.replaceChildren();
  cards = [];
  if (!model.machines.length) {
    box.append(el("p", "empty", "fleet not read: " + (model.fleet_error ? model.fleet_error.reason : "no machines")));
    return;
  }
  for (const m of model.machines) {
    const seats = m.leads.flatMap((l) => l.seats), mix = el("span", "mix");
    for (const s of ORDER) {
      const n = seats.filter((x) => x.status === s).length;
      if (n) { const i = el("i"); i.style.flex = n; i.style.background = "var(--" + s + ")"; mix.append(i); }
    }
    const c = el("div", "host"), cv = el("canvas"), info = el("div", "hinfo"), name = el("div", "hname"), live = el("span", m.fresh ? "live" : "live stale");
    live.append(el("i"), (m.fresh ? "online" : "stale") + " · beat " + ago(m.age_s) + " ago");
    name.append(el("b", null, m.host), el("span", null, m.leads.length + (m.leads.length === 1 ? " lead" : " leads")), live);
    const mem = m.mem_used, cpu = m.cpu == null ? null : m.cpu / 100;
    info.append(name, meter("Sessions", mix, seats.length),
      meter("Memory", track(mem, mem > .85 ? "parked" : "ok"), mem == null ? "not sampled" : Math.round(mem * 100) + "%"),
      meter("Spawn cap", track(m.cap ? seats.length / m.cap : null, seats.length >= m.cap ? "parked" : "quiet"), m.cap == null ? "not published" : seats.length + " / " + m.cap),
      meter("CPU", track(cpu, "quiet"), cpu == null ? "not sampled" : Math.round(m.cpu) + "%"));
    cv.width = cv.height = 240;
    cv.setAttribute("aria-hidden", "true");
    c.append(cv, info);
    box.append(c);
    cards.push({cv, h: m});
  }
}

const work = (r, k) => r.s.work ? r.s.work[k] : null;
const model_ = (r) => r.s.model && r.s.model + (r.s.model_basis ? " (" + r.s.model_basis + ")" : "");
const COLS = [
  ["machine", (r) => r.host], ["lead", (r) => r.lead], ["seat", (r) => r.s.name], ["harness", (r) => r.s.harness],
  ["model", model_], ["state", (r) => ORDER.indexOf(r.s.status), (v, r) => r.s.status],
  ["alive", (r) => since(r.s.started_at), ago], ["last msg", (r) => since(r.s.last_message_at), (v) => ago(v) + " ago"],
  ["node", (r) => work(r, "id")], ["PR", (r) => work(r, "pr"), (v) => "#" + v],
];
let rows = [], hiddenHosts = new Set(), hiddenStates = new Set(), sort = {col: 5, dir: 1}, openKey = null;
const keyOf = (r) => r.host + "/" + (r.s.session_id || r.s.name);
for (const [id, view] of [["tab-synapse", "view-synapse"], ["tab-table", "view-table"]]) {
  document.getElementById(id).onclick = () => {
    for (const t of ["synapse", "table"]) {
      document.getElementById("tab-" + t).setAttribute("aria-selected", String("view-" + t === view));
      document.getElementById("view-" + t).hidden = "view-" + t !== view;
    }
  };
}

function seats(model) {
  rows = model.machines.flatMap((m) => m.leads.flatMap((l) => l.seats.map((s) => ({host: m.host, local: m.local, lead: l.name, s}))));
  const chips = document.getElementById("chips");
  chips.replaceChildren(el("label", null, "Machine"));
  for (const m of model.machines) {
    const b = el("button", "chip", m.host + " · " + rows.filter((r) => r.host === m.host).length);
    b.setAttribute("aria-pressed", String(!hiddenHosts.has(m.host)));
    b.onclick = () => { hiddenHosts.has(m.host) ? hiddenHosts.delete(m.host) : hiddenHosts.add(m.host); seats(model); };
    chips.append(b);
  }
  paint();
  graph(model);
  const again = rows.find((r) => keyOf(r) === openKey);
  if (again) openSeat(again); else if (openKey) closeSeat();
}

function paint() {
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const hay = (r) => [r.host, r.lead, r.s.name, r.s.session_id, r.s.harness, r.s.model, work(r, "id"), work(r, "title")];
  const shown = rows.filter((r) => !hiddenHosts.has(r.host) && !hiddenStates.has(r.s.status) && (!q || hay(r).some((v) => v && String(v).toLowerCase().includes(q))));
  const get = COLS[sort.col][1];
  shown.sort((a, b) => {
    const x = get(a), y = get(b);
    if (x == null || y == null) return (x == null) - (y == null);
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sort.dir;
  });
  document.getElementById("thead").replaceChildren(...COLS.map(([label], i) => {
    const th = el("th", null, label);
    if (i === sort.col) th.setAttribute("aria-sort", sort.dir > 0 ? "ascending" : "descending");
    th.tabIndex = 0;
    th.onclick = th.onkeydown = (e) => {
      if (e.key && e.key !== "Enter") return;
      sort = {col: i, dir: i === sort.col ? -sort.dir : 1};
      paint();
    };
    return th;
  }));
  document.getElementById("tbody").replaceChildren(...shown.map((r) => {
    const tr = el("tr");
    tr.tabIndex = 0;
    for (const [label, get, fmt] of COLS) {
      const v = get(r), td = el("td", typeof v === "number" ? "num" : null);
      if (label === "state") td.append(dot(r.s.status), " ");
      td.append(v == null ? (label === "last msg" ? "not published" : "") : fmt ? fmt(v, r) : v);
      if (label === "node" && work(r, "title")) td.append(el("span", "sub", work(r, "title")));
      tr.append(td);
    }
    tr.onclick = () => openSeat(r);
    tr.onkeydown = (e) => { if (e.key === "Enter") openSeat(r); };
    return tr;
  }));
  document.getElementById("rowcount").textContent = shown.length + " of " + rows.length + " seats";
}

const drawer = document.getElementById("drawer");
function openSeat(r) {
  const s = r.s, at = (iso) => iso ? iso + " (" + ago(since(iso)) + " ago)" : "not published";
