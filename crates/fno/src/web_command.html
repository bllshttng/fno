<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fno command</title>
<style>
/* The fleet-synapse mockup's look: glass bar, state colors, machine meters. Fonts fall back to the system; the page loads nothing from outside. */
:root{--bg:#07080D;--bg2:#0D1018;--glass:rgba(22,26,38,.62);--line:rgba(150,170,220,.14);--fg:#E9ECF5;--muted:#8E96AC;--faint:#5B6378;--writing:#5CE1FF;--parked:#FFB547;--quiet:#9A8CFF;--unknown:#6B7286;--ok:#57D990;--link:#8FC8FF;--font-ui:"Onest",ui-sans-serif,system-ui,-apple-system,sans-serif;--font-data:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--spring:cubic-bezier(.2,.9,.25,1.08);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.bar{position:sticky;top:46px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:12px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}.brand span{font-family:var(--font-data);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.counts{display:flex;flex-wrap:wrap;gap:6px}.count{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:12.5px;font-variant-numeric:tabular-nums}.count b{font-weight:600}.dot{width:8px;height:8px;border-radius:50%;flex:none}
#banners:empty{display:none}.banner{padding:10px 14px;border-radius:14px;border:1px solid rgba(255,181,71,.35);background:rgba(255,181,71,.08);color:var(--parked)}
.fleet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.host{padding:16px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01))}
.hinfo{display:flex;flex-direction:column;gap:8px;min-width:0}.hname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.hname b{font-size:18px;font-weight:600}.hname span{font-family:var(--font-data);font-size:11px;color:var(--muted)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ok)}.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:ping 2.2s infinite}.live.stale{color:var(--parked)}.live.stale i{background:var(--parked);animation:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(87,217,144,.55)}80%,100%{box-shadow:0 0 0 9px rgba(87,217,144,0)}}
.meter{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}.meter>span:first-child{color:var(--muted)}.meter b{font-weight:500;font-variant-numeric:tabular-nums}.track{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}.track i{display:block;height:100%;border-radius:3px}.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.panel{border-radius:22px;border:1px solid var(--line);background:var(--bg2);padding:14px 16px;display:flex;flex-direction:column;gap:8px}.panel h2,.panel h3{margin:4px 0 2px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.lk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03)}.lt{display:flex;flex-direction:column;min-width:0;gap:2px;flex:1}.lt b{font-weight:500;font-size:13px;overflow-wrap:anywhere}.lt code{font-family:var(--font-data);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.empty{color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><div class="brand"><span id="age">fno fleet · reading</span><h1>Command</h1></div><div class="counts" id="counts"></div></header>
  <div id="banners"></div>
  <section class="fleet" id="machines" aria-label="Machines"><p class="empty">reading the fleet</p></section>
  <section class="panel" aria-label="Waiting on you"><h2>Waiting on you</h2><div id="waiting"></div></section>
</div>
<script>
(() => {
const ORDER = ["writing", "parked", "quiet", "unknown"];
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
const ago = (s) => s == null ? "unknown" : s < 90 ? s + "s" : s < 5400 ? Math.round(s / 60) + "m" : s < 172800 ? Math.round(s / 3600) + "h" : Math.round(s / 86400) + "d";
const dot = (state) => { const d = el("i", "dot"); d.style.background = "var(--" + state + ")"; return d; };
const since = (iso) => { const t = Date.parse(iso); return isNaN(t) ? null : Math.max(0, Math.round((Date.now() - t) / 1000)); };

function header(model) {
  const all = model.machines.flatMap((m) => m.leads.flatMap((l) => l.seats));
  const counts = document.getElementById("counts");
  counts.replaceChildren();
  const q = model.waiting.questions;
  const add = (n, word, color) => {
    const c = el("span", "count");
    if (color) c.append(dot(color));
    c.append(el("b", null, n), " " + word);
    counts.append(c);
  };
  for (const s of ORDER) add(all.filter((x) => x.status === s).length, s, s);
  add(q ? q.length : "?", "questions");
  document.getElementById("age").textContent = "fno fleet · " + (model.age_s == null ? "not read" : "read " + ago(model.age_s) + " ago") + " · " + all.length + " sessions";
}

function banners(model) {
  const box = document.getElementById("banners");
  box.replaceChildren();
  const add = (text) => box.append(el("div", "banner", text));
  const e = model.fleet_error;
  if (e && model.machines.length) add("fleet read failed " + ago(e.failed_age_s) + " ago: " + e.reason + "; showing the read from " + ago(model.age_s) + " ago");
  if (model.notice) add(model.notice);
  if (model.seat_error) add(model.seat_error);
}

function waiting(model) {
  const box = document.getElementById("waiting");
  box.replaceChildren();
  const w = model.waiting;
  if (w.questions_error) box.append(el("p", "empty", "questions not read: " + w.questions_error));
  const qs = w.questions || [];
  const hosts = [...new Set(qs.map((q) => q.host))].sort((a, b) => (a != null) - (b != null) || String(a).localeCompare(String(b)));
  for (const host of hosts) {
    box.append(el("h3", null, host == null ? "this machine" : host));
    for (const q of qs.filter((x) => x.host === host)) {
      const r = el("div", "lk"), t = el("span", "lt");
      t.append(el("b", null, q.title || q.id));
      t.append(el("code", null, [q.node || "no node", ago(since(q.created_at)) + " old", "fno inbox outstanding clear " + q.id + " --answer \"…\"" + (host == null ? "" : " (on " + host + ")")].join(" · ")));
      r.append(t);
      box.append(r);
    }
  }
  if (!qs.length && !w.questions_error) box.append(el("p", "empty", "Nothing waits on you (read " + ago(model.age_s) + " ago)"));
}

const meter = (label, bar, value) => {
  const m = el("div", "meter");
  m.append(el("span", null, label), bar, el("b", null, value));
  return m;
};
const track = (frac, color) => {
  const t = el("span", "track"), i = el("i");
  if (frac != null) { i.style.width = Math.min(100, frac * 100) + "%"; i.style.background = "var(--" + color + ")"; }
  t.append(i);
  return t;
};
function machines(model) {
  const box = document.getElementById("machines");
  box.replaceChildren();
  if (!model.machines.length) {
    box.append(el("p", "empty", "fleet not read: " + (model.fleet_error ? model.fleet_error.reason : "no machines")));
    return;
  }
  for (const m of model.machines) {
    const seats = m.leads.flatMap((l) => l.seats), mix = el("span", "mix");
    for (const s of ORDER) {
      const n = seats.filter((x) => x.status === s).length;
      if (n) { const i = el("i"); i.style.flex = n; i.style.background = "var(--" + s + ")"; mix.append(i); }
    }
    const c = el("div", "host"), info = el("div", "hinfo"), name = el("div", "hname"), live = el("span", m.fresh ? "live" : "live stale");
    live.append(el("i"), (m.fresh ? "online" : "stale") + " · beat " + ago(m.age_s) + " ago");
    name.append(el("b", null, m.host), el("span", null, m.leads.length + (m.leads.length === 1 ? " lead" : " leads")), live);
    const mem = m.mem_used, cpu = m.cpu == null ? null : m.cpu / 100;
    info.append(name, meter("Sessions", mix, seats.length),
      meter("Memory", track(mem, mem > .85 ? "parked" : "ok"), mem == null ? "not sampled" : Math.round(mem * 100) + "%"),
      meter("Spawn cap", track(m.cap ? seats.length / m.cap : null, seats.length >= m.cap ? "parked" : "quiet"), m.cap == null ? "not published" : seats.length + " / " + m.cap),
      meter("CPU", track(cpu, "quiet"), cpu == null ? "not sampled" : Math.round(m.cpu) + "%"));
    c.append(info);
    box.append(c);
  }
}

const nav = document.querySelector("nav.fno-nav");
const token = new URLSearchParams(location.search).get("t") || "";
const url = (nav ? nav.dataset.base : "./") + "command/model.json?t=" + encodeURIComponent(token);
async function load() {
  let res;
  try { res = await fetch(url, {cache: "no-store"}); } catch (e) { res = {ok: false, status: e.message}; }
  if (!res.ok) {
    document.getElementById("banners").replaceChildren(el("div", "banner", "model.json not reachable: " + res.status));
    return;
  }
  const model = await res.json();
  header(model); banners(model); waiting(model); machines(model);
}
load();
setInterval(() => { if (document.visibilityState === "visible") load(); }, 60000);
})();
</script>
</body>
</html>
