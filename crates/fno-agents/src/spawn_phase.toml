# spawn_phase.toml - which session phase a spawn payload's verb names.
# Canonical home: this file. spawn_phase.rs reads it.
# A verb matches its bare (/verb), plugin (/fno:verb) and codex ($fno:verb) spellings.
[phases]
execute = ["target", "execute", "tdd", "fix", "do"]
review = ["review", "code-review"]
blueprint = ["blueprint"]
think = ["think"]
ship = ["pr", "ship"]
