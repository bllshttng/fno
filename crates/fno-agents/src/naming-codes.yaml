# The dispatch-provenance vocabulary: data behind
# cli/src/fno/agents/naming.py, the single owner of worker-name generation.
# A code here is contract, not decoration: autonomy status, the CI provenance
# audit, and `fno agents name --source/--command` all read this table.
schema_version: 1
sources:
  # ab covers BOTH active-backlog rows (parallel fill + mission converge):
  # same owner, same gate; the name names the source, not the internal branch.
  - ab   # active-backlog daemon
  - ac   # merge-triggered auto-continue
  - rd   # reconcile de-stub
  - th   # spawn_think
  - pm   # post-merge judgment
  - pw   # pr-watch
  - rec  # recovery sweep
  - kg   # keep-going
  - gr   # groom
  - ro   # restart orphan revive
  - ev   # evals runner
  - kl   # lead loop
  - oh   # provider outage handoff
  - sh   # target self-handoff
  - ex   # execute foreign wave
  - jn   # backlog join (operator command)
commands:
  - t   # target
  - bp  # blueprint
  - r   # research/review
  - th  # think
  - f   # fix
# Harness-map work-command words -> codes; `builtin` is the no-declared-command
# target path. One table so no producer keeps a second mapping that drifts.
word_codes:
  target: t
  blueprint: bp
  review: r
  research: r
  think: th
  fix: f
  builtin: t
# the short per-model name tag, matched longest-key-first as a
# substring of the lowered model string. An unknown model falls back to the
# first 8 alphanumeric characters.
model_codes:
  opus: opus
  sonnet: sonnet
  haiku: haiku
  fable: fable
  glm: glm
  luna: luna
  astra: astra
  sol: sol
# Every dispatch path with its codes. command "resolved" = decided at dispatch
# time from the harness-map receipt. The CI audit refuses when a path loses
# its row or the two ab rows stop holding.
provenance:
  - { site: "dispatch_lanes (parallel fill)",      source: ab,  command: resolved }
  - { site: "epic converge (mission drain)",       source: ab,  command: resolved }
  - { site: "advance (node-walk)",                 source: ac,  command: resolved }
  - { site: "reconcile_dispatch (G4 de-stub)",     source: rd,  command: t }
  - { site: "spawn_think (context /think)",        source: th,  command: th }
  - { site: "post-merge ritual",                   source: pm,  command: r }
  - { site: "pr_watch (headless PR poll)",         source: pw,  command: r }
  - { site: "recovery sweep (crash respawn)",      source: rec, command: resolved }
  - { site: "keep_going (autonomous follow-up)",   source: kg,  command: t }
  - { site: "groom (_spawn_groom_worker)",         source: gr,  command: th }
  - { site: "restart (_revive_orphans)",           source: ro,  command: resolved }
  - { site: "evals runner",                        source: ev,  command: th }
  - { site: "lead loop",                           source: kl,  command: th }
  - { site: "outage handoff",                      source: oh,  command: t }
  - { site: "target self-handoff",                 source: sh,  command: t }
  - { site: "execute foreign wave",                source: ex,  command: t }
  - { site: "backlog join",                        source: jn,  command: t }
