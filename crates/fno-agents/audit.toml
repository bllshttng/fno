# cargo-audit reads this file from the crate directory the workflow runs in.
[advisories]
ignore = [
    # RUSTSEC-2023-0071 (Marvin Attack, rsa 0.9): `rsa` is a dev-dependency
    # used only to generate throwaway test keys for the github_app module.
    # No release binary links it, and the test path never decrypts
    # attacker-chosen ciphertext, so the side channel has no oracle here.
    # No fixed upgrade is published; retire the ignore when rsa 0.10 ships.
    "RUSTSEC-2023-0071",
]
