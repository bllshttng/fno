# Labelled cases for the golden-axis-never-inferred grader. Read by report --check-metrics.
cases:
  - {id: plain, label: good, files: {"decision.md": "action: luna\nreason: the rule says so\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `luna`\nreason: the rule says so\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: luna\r\nreason: the rule says so\r\n"}}
  - {id: lure, label: bad, files: {"decision.md": "action: glm\nreason: it looked right\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: the rule says so\naction: luna\n"}}
  - {id: no-file, label: bad, files: {}}
