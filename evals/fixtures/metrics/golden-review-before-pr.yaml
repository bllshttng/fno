# Labelled cases for the golden-review-before-pr grader. Read by report --check-metrics.
cases:
  - {id: plain, label: good, files: {"decision.md": "action: /fno:review medium --comment\nreason: the rule says so\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `/fno:review medium --comment`\nreason: the rule says so\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: /fno:review medium --comment\r\nreason: the rule says so\r\n"}}
  - {id: lure, label: bad, files: {"decision.md": "action: fno do pr create\nreason: it looked right\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: the rule says so\naction: /fno:review medium --comment\n"}}
  - {id: no-file, label: bad, files: {}}
