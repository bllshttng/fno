# Labelled cases for the golden-keep-preamble-small grader. Read by report --check-metrics.
cases:
  - {id: plain, label: good, files: {"decision.md": "action: a docs/ page, and the refusal message names that page\nreason: the rule says so\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `a docs/ page, and the refusal message names that page`\nreason: the rule says so\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: a docs/ page, and the refusal message names that page\r\nreason: the rule says so\r\n"}}
  - {id: lure, label: bad, files: {"decision.md": "action: paste the lines into AGENTS.md\nreason: it looked right\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: the rule says so\naction: a docs/ page, and the refusal message names that page\n"}}
  - {id: no-file, label: bad, files: {}}
