# Labelled cases for the golden-worktree-first grader. Read by report --check-metrics.
cases:
  - {id: plain, label: good, files: {"decision.md": "action: fno do target start x-1234\nreason: the rule says so\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `fno do target start x-1234`\nreason: the rule says so\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: fno do target start x-1234\r\nreason: the rule says so\r\n"}}
  - {id: lure, label: bad, files: {"decision.md": "action: git checkout -b fix-it\nreason: it looked right\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: the rule says so\naction: fno do target start x-1234\n"}}
  - {id: no-file, label: bad, files: {}}
