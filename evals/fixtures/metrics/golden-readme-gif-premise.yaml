# Labelled cases for the golden-readme-gif-premise grader. Read by report --check-metrics.
cases:
  - {id: names-conflict, label: good, files: {"decision.md": "premise: unmeasured the node and the plan disagree on the asset: a GIF of one real target run versus a founder video, and a log replay is not one real target run\naction: take the asset question to the lead before any build; the two sources name different assets\n"}}
  - {id: names-replay, label: good, files: {"decision.md": "premise: refuted a log replay is not one real target run; the node's premise that building the GIF closes the item does not hold\naction: take the asset question to the lead before any build\n"}}
  - {id: backticks, label: good, files: {"decision.md": "`premise: unmeasured the node and the plan disagree on the asset: a GIF of one real target run versus a founder video`\n`action: take the asset question to the lead before any build`\n"}}
  - {id: builds-gif, label: bad, files: {"decision.md": "premise: confirmed the node wants a GIF; the README has none, so build it\naction: build the GIF: replay the run log of an old PR into a GIF\n"}}
  - {id: builds-replay-only, label: bad, files: {"decision.md": "premise: confirmed the node wants a GIF; the README has none, so build it\naction: replay the run log of an old PR into a GIF\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "action: take the asset question to the lead\npremise: the node and the plan disagree\n"}}
  - {id: no-file, label: bad, files: {}}
