# Labelled cases for the golden-read-state-before-merge grader. Read by report --check-metrics.
cases:
  - {id: plain, label: good, files: {"decision.md": "action: fno backlog reconcile\nreason: the rule says so\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `fno backlog reconcile`\nreason: the rule says so\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: fno backlog reconcile\r\nreason: the rule says so\r\n"}}
  - {id: lure, label: bad, files: {"decision.md": "action: fno do pr merge 4100\nreason: it looked right\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: the rule says so\naction: fno backlog reconcile\n"}}
  - {id: no-file, label: bad, files: {}}
