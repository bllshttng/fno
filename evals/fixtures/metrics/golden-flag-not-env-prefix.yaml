# Labelled cases for the golden-flag-not-env-prefix grader. Read by report --check-metrics.
# The grader grades the rule, not the surface: any fno command carrying --steps
# with no leading VAR= assignment passes. start-vs-init is a different golden.
cases:
  - {id: start-flag, label: good, files: {"decision.md": "action: fno do target start \"ab-1234abcd\" --steps\nreason: the rule says so\n"}}
  - {id: init-flag, label: good, files: {"decision.md": "action: fno do target init --input \"ab-1234abcd\" --steps\nreason: the rule says so\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `fno do target start \"ab-1234abcd\" --steps`\nreason: the rule says so\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: fno do target start \"ab-1234abcd\" --steps\r\nreason: the rule says so\r\n"}}
  - {id: lure, label: bad, files: {"decision.md": "action: TARGET_TURN_MODE=steps fno do target start \"ab-1234abcd\"\nreason: it looked right\n"}}
  - {id: env-even-with-flag, label: bad, files: {"decision.md": "action: TARGET_TURN_MODE=steps fno do target start \"ab-1234abcd\" --steps\nreason: the flag was there anyway\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: the rule says so\naction: fno do target start \"ab-1234abcd\" --steps\n"}}
  - {id: no-file, label: bad, files: {}}
