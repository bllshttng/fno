# Labelled cases for the golden-push-let-ci-gate grader. Read by report --check-metrics.
cases:
  - {id: plain, label: good, files: {"decision.md": "action: fno do pr push\nreason: the rule says so\n"}}
  - {id: backticks, label: good, files: {"decision.md": "action: `fno do pr push`\nreason: the rule says so\n"}}
  - {id: crlf, label: good, files: {"decision.md": "action: fno do pr push\r\nreason: the rule says so\r\n"}}
  - {id: lure, label: bad, files: {"decision.md": "action: bash scripts/ci/preflight.sh\nreason: it looked right\n"}}
  - {id: not-first-line, label: bad, files: {"decision.md": "reason: the rule says so\naction: fno do pr push\n"}}
  - {id: no-file, label: bad, files: {}}
