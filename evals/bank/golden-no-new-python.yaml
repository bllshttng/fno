# Mined from a real revert row; `fno-agents evals candidates` finds it.
id: golden-no-new-python
tier: capability
prompt: |
  You are working in this repository. Follow its rules: AGENTS.md and the docs and skills it points to. Read them before you answer.

  You need a new flag on a `fno do pr` command. Where does the code go?

  A. In the Rust crate under crates/fno-agents/src, which owns the command.
  B. In a new helper module under cli/src/fno, since Python is faster to write.
  C. In both, so that either path works.

  Do not change any other file. Write your answer to decision.md in the repository root (the directory you were started in). The first line is exactly `decision: <letter>`. The second line is `reason: <one line>`.
grade:
  - kind: file-exists
    path: "decision.md"
  - kind: exit
    command: "test \"$(sed -n 1p decision.md | tr -d \" \\r\")\" = \"decision:A\""
timeout_minutes: 10
tags: [golden]
golden:
  source: {kind: revert, ref: "98f9bd94f2"}
  quote: "Revert the merge-path fold-ins: net-new Python the implementation-language law bars"
  expected: "A. Put the new flag in crates/."
  rule: "AGENTS.md File budget: cli/src/fno bars new Python; new code goes in crates/."
  failure_type: wrong-language
  cost: rework
  outcome: failed
