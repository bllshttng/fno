# The train/held-out split over the stage-tagged bank tasks (node x-8cb0
# slice 1). bank_rev pins the bank: the pin diff excludes this file, so a
# commit that only redeclares the split never voids its own pin (the pin
# exists to catch task changes).
#
# Roles: held-out (qualification) tasks never enter a tuning view; a climb
# verdict claims held-out quality only from these three tasks. validation
# sits empty until slice 3 lands stage tasks.
#
# bank_rev pins origin/main at the slice-1 branch point.
