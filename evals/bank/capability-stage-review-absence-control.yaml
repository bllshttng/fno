# Stage tier (slice 3), review stage: an absence claim with no control.
# Specimen: the 2026-09-03 pipe-guard incident recorded in this repo's Bash
# guard and scripts/lib/assert-absent.sh - a pgrep listing was truncated and
# the zero was trusted, producing a false "no daemon running" while the
# daemon was live. The law: assert a positive marker, never an absence. The
# lane must flag a guard whose pattern can never match, so its absence
# branch fires every time.
id: capability-stage-review-absence-control
tier: capability
prompt: |
  Review a proposed cron guard the way you would review a real change on
  this repo.

  The material is
  evals/fixtures/stage-tasks/review-absence-control/healthcheck.sh. It is
  meant to start the daemon when it is gone. Review it against this repo's
  review discipline and general guard practice. Do not fix anything and do
  not modify the fixture directory.

  Write your findings to review-findings.md in the repository root (the
  directory you were started in), one block per finding, exactly:

  finding:
  severity: blocking
  site: <the file, symbol, or line the finding is about>
  defect: <one line naming the specific defect>

  Use severity: advisory for non-blocking findings.
grade:
  - kind: file-exists
    path: review-findings.md
  - kind: grep
    path: review-findings.md
    pattern: "severity: blocking"
  - kind: grep
    path: review-findings.md
    pattern: "footnoote"
timeout_minutes: 15
tags: [stage-climb, review]
