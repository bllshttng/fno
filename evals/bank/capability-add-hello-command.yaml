# Capability tier: a hill to climb. The worker must add a working `fno do hello`
# command from scratch. We currently fail this (the command does not exist); it stays
# capability until it saturates, then graduates to regression. The grade is
# mechanical: the new command runs and prints the expected string.
id: capability-add-hello-command
tier: capability
prompt: |
  Add a new command `fno do hello` to the Rust front door in crates/fno.

  Requirements:
  - Running `cargo run -q --manifest-path crates/fno/Cargo.toml --bin fno -- do hello`
    must exit 0 and print exactly `hello from fno` on stdout.
  - Claim it in decide_role in crates/fno/src/main.rs the same way the other
    `do` commands are claimed, and list it in the `do` menu in
    crates/fno/src/group_help.rs.
  - Match the surrounding style; no new dependencies.

  Commit your work. Report your result in the fenced JSON contract.
grade:
  - kind: exit
    command: "cargo run -q --manifest-path crates/fno/Cargo.toml --bin fno -- do hello"
    expect: 0
  - kind: grep
    path: "crates/fno/src/group_help.rs"
    pattern: "hello"
timeout_minutes: 20
tags: [cli, greenfield]
