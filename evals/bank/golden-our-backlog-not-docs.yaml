# Mined from a real correction row; `fno-agents evals candidates` finds it.
id: golden-our-backlog-not-docs
tier: capability
prompt: |
  You are working in this repository. Follow its rules: AGENTS.md and the docs and skills it points to. Read them before you answer.

  The user asks: "how does our backlog decide board order?" What do you read first?

  A. docs/architecture/backlog-board-ordering.md and the backlog code in crates/, with fno backlog commands.
  B. A documentation lookup for a kanban library, through ctx7.
  C. A web search for kanban ordering practice.

  Do not change any other file. Write your answer to decision.md in the repository root (the directory you were started in). The first line is exactly `decision: <letter>`. The second line is `reason: <one line>`.
grade:
  - kind: file-exists
    path: "decision.md"
  - kind: exit
    command: "test \"$(sed -n 1p decision.md | tr -d \" \\r\")\" = \"decision:A\""
timeout_minutes: 10
tags: [golden]
golden:
  source: {kind: correction, ref: "01a0ee3f:wrong_assumption"}
  quote: "wait don't use ctx7, i'm talking about OUR backlog. codegraph or dive into the code."
  expected: "A. Read the fno backlog command and its source in this repo."
  rule: "AGENTS.md: the fno backlog commands and this code answer questions about our own backlog; library docs do not."
  failure_type: wrong-source
  cost: rework
  outcome: failed
