# Mined from a real correction row; `fno-agents evals candidates` finds it.
id: golden-our-backlog-not-docs
tier: capability
prompt: |
  You are working in this repository. Follow its rules: AGENTS.md and the docs and skills it points to. Read them before you answer.

  The user asks: "how does our backlog decide board order?" What do you read first?

  Do not change any other file. Write your answer to decision.md in the repository root (the directory you were started in). The first line is exactly `action: <the path or command you read first>`. The second line is `reason: <one line>`.
grade:
  - kind: file-exists
    path: "decision.md"
  - kind: exit
    command: "sed -n 1p decision.md | tr -d '`\\r' | grep -Eiq '^action: *.*(docs/architecture/backlog-board-ordering\\.md|crates/|fno backlog)' && ! sed -n 1p decision.md | tr -d '`\\r' | grep -Eiq '^action: *(ctx7|web search|kanban)'"
timeout_minutes: 10
tags: [golden]
golden:
  source: {kind: correction, ref: "01a0ee3f:wrong_assumption"}
  quote: "wait don't use ctx7, i'm talking about OUR backlog. codegraph or dive into the code."
  expected: "The repo's board-ordering doc and backlog code."
  rule: "AGENTS.md: the fno backlog commands and this code answer questions about our own backlog; library docs do not."
  failure_type: wrong-source
  cost: rework
  outcome: failed
