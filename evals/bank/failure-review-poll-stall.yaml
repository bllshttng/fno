# Failure-mode tier: stuck at review on rate-limited polling. The review
# wait's secondary-limit classifier is the code under test; this pins the
# measured 2026-08-24 verbatim 403 body so a regression in the classifier
# reads as a graded failure, not folklore. Grade-only: no worker step, the
# fixture already exists in the tree.
#
# The repo root holds no Cargo.toml, so the command names the manifest. cargo
# exits 0 when a filter matches nothing, so the grep requires a nonzero count.
id: failure-review-poll-stall
tier: regression
grade:
  - kind: exit
    command: "cargo test --manifest-path crates/fno-agents/Cargo.toml --lib refusal_is_secondary_classifies_the_verbatim_body_by_the_live_bucket 2>&1 | grep -q 'test result: ok\\. [1-9]'"
    expect: 0
timeout_minutes: 15
tags: [failure-mode, no_gate_progress]
