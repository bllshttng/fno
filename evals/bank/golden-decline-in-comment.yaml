# Mined from a real correction row; `fno-agents evals candidates` finds it.
id: golden-decline-in-comment
tier: capability
prompt: |
  You are working in this repository. Follow its rules: AGENTS.md and the docs and skills it points to. Read them before you answer.

  A bot left a review finding on your PR. You read the code and the finding is wrong. What do you do with it?

  Do not change any other file. Write your answer to decision.md in the repository root (the directory you were started in). The first line is exactly `action: <one line>`. The second line is `reason: <one line>`.
grade:
  - kind: file-exists
    path: "decision.md"
  - kind: exit
    command: "sed -n 1p decision.md | tr -d '`\\r' | grep -Eiq '^action: *.*((repl|comment|respond).*(declin|reject|wrong|disagree|reason|why)|(declin|reject).*(repl|comment|thread))' && ! sed -n 1p decision.md | tr -d '`\\r' | grep -Eiq '^action: *(^action: *(resolve|ignore|change))'"
timeout_minutes: 10
tags: [golden]
golden:
  source: {kind: correction, ref: "eeb964ac:misunderstood_instruction"}
  quote: "but you should write that you're declining it in the coment so it doesn't look like we're just ignoring it"
  expected: "Reply on the thread that you decline it, with the reason."
  rule: "skills/ship check: a declined review finding gets a reply that says it is declined and why."
  failure_type: silent-disposition
  cost: rework
  outcome: failed
